<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>WhānauSaver Admin Registration</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .form-container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 600px;
        overflow-y: auto;
        max-height: 95vh;
    }
    h2 {
        color: #005a9c;
        text-align: center;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }
    input[type="text"], input[type="email"], select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    input[type="checkbox"] {
        margin-right: 8px;
        transform: scale(1.1);
    }
    .checkbox-group {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px 10px;
    }
    input[type="submit"] {
        background-color: #005a9c;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 20px;
        padding: 10px;
        width: 100%;
        font-size: 16px;
    }
    input[type="submit"]:hover {
        background-color: #004080;
    }
    .logo {
        text-align: center;
        margin-bottom: 20px;
    }
    .logo img {
        max-width: 200px;
    }
</style>

<script>
    function toggleIwiField() {
        const role = document.getElementById("role").value;
        const iwiGroup = document.getElementById("iwi-group");
        const iwiCheckboxes = document.querySelectorAll("input[name='iwi']");

        if (role === "Iwi Reviewer") {
            iwiGroup.style.display = "block";
            iwiCheckboxes.forEach(box => box.required = false);
        } else {
            iwiGroup.style.display = "none";
            iwiCheckboxes.forEach(box => box.checked = false);
        }
    }

    async function submitForm(event) {
        event.preventDefault();

        // ✅ Collect selected iwi as plain text string (comma-separated)
        const selectedIwi = Array.from(document.querySelectorAll("input[name='iwi']:checked"))
            .map(cb => cb.value)
            .join(", ");

        const data = {
            role: document.getElementById("role").value,
            iwi: selectedIwi,
            firstname: document.getElementById("firstname").value,
            lastname: document.getElementById("lastname").value,
            email: document.getElementById("email").value,
            orgrole: document.getElementById("orgrole").value
        };

        const response = await fetch("https://default4c7dc6b7f64f40a6a237ac11d6c92a.eb.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f5261b99e58d4cb98b48a09ada146a41/triggers/manual/paths/invoke/?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GOgj9sAq_O2SUXiv9-iYf3mmslLMNIyRoXAjYSnOUXo", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            window.location.href = "thankyou.html";
        } else {
            alert("Submission failed. Please try again.");
        }
    }
</script>
</head>

<body>
<div class="form-container">
    <div class="logo">
        <!-- Optional: add your logo -->
        <!-- <img src="logo.png" alt="WhānauSaver Logo"> -->
    </div>

    <h2>WhānauSaver Admin Registration</h2>

    <form onsubmit="submitForm(event)">
        <label for="role">Select your role:</label>
        <select id="role" name="role" onchange="toggleIwiField()" required>
            <option value="">--Please choose an option--</option>
            <option value="Iwi Reviewer">Iwi Reviewer</option>
            <option value="SuperLife Admin">SuperLife Admin</option>
            <option value="Ka Uruora Admin">Ka Uruora Admin</option>
        </select>

        <div id="iwi-group" style="display:none;">
            <label>Select your Iwi (you may choose more than one):</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="iwi" value="Te Kāhui o Taranaki Iwi">Te Kāhui o Taranaki Iwi</label>
                <label><input type="checkbox" name="iwi" value="Te Kōtahitanga o Te Atiawa">Te Kōtahitanga o Te Atiawa</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Maru">Ngāti Maru</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Ruanui">Ngāti Ruanui</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Tama o Taranaki">Ngāti Tama o Taranaki</label>
                <label><input type="checkbox" name="iwi" value="Ngā Rauru">Ngā Rauru</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Mutunga">Ngāti Mutunga</label>
                <label><input type="checkbox" name="iwi" value="Ngāruahine">Ngāruahine</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Kuia">Ngāti Kuia</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Rārua">Ngāti Rārua</label>
                <label><input type="checkbox" name="iwi" value="Ngāti Tama ki te Waipounamu">Ngāti Tama ki te Waipounamu</label>
                <label><input type="checkbox" name="iwi" value="Rangitane o Wairau">Rangitane o Wairau</label>
                <label><input type="checkbox" name="iwi" value="Te Ātiawa ki te Waka-ā-Māui">Te Ātiawa ki te Waka-ā-Māui</label>
            </div>
        </div>

        <label for="firstname">First Name:</label>
        <input id="firstname" name="firstname" required type="text"/>

        <label for="lastname">Last Name:</label>
        <input id="lastname" name="lastname" required type="text"/>

        <label for="email">Email Address:</label>
        <input id="email" name="email" required type="email"/>

        <label for="orgrole">Organisational Role:</label>
        <input id="orgrole" name="orgrole" type="text"/>

        <input type="submit" value="Submit"/>
    </form>
</div>
</body>
</html>
